name: Q266 failed-terminal phase diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  diagnose:
    name: "Q266 diagnostic (${{ matrix.owner }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: failed-terminal-phases
            kind: projection
            pattern: "^a failed projection keeps its own failure through the same query's failed terminal$"
          - owner: graphql-finite
            kind: finite
    defaults:
      run:
        shell: bash
        working-directory: hesperia
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: hesperia
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: hesperia-js/aeolia
          ref: 9bf36bb99937b3e18eec050ad5aa6559ac27f3fb
          path: aeolia
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Verify diagnostic source provenance
        run: |
          test "$(git rev-parse HEAD^)" = "3dd942e4ad4cd0a2e14450960361a082a337fe63"
          node --input-type=module <<'JS'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const path = "tests/data/contract-adapter.integration.test.ts";
          const files = execFileSync("git", ["diff", "--name-only", "HEAD^", "HEAD"], { encoding: "utf8" }).trim().split("\n");
          if (JSON.stringify(files) !== JSON.stringify([".github/workflows/ci.yml", path])) throw new Error("Unexpected diagnostic paths");
          const original = execFileSync("git", ["show", `HEAD^:${path}`], { encoding: "utf8" });
          const lines = readFileSync(path, "utf8").split("\n");
          const isMarker = (line) => /^\s*console\.error\("Q266_DIAG: [a-z0-9-]+"\);$/.test(line);
          if (lines.filter(isMarker).length !== 18 || lines.filter((line) => !isMarker(line)).join("\n") !== original) throw new Error("Changes outside the phase markers");
          console.log("Original composed source:", execFileSync("git", ["rev-parse", "HEAD^"], { encoding: "utf8" }).trim());
          console.log("Only diagnostic workflow and 18 removable test markers differ");
          JS
      - name: Install the committed Hesperia lock
        run: |
          echo "Hesperia checkout: $(git rev-parse HEAD)"
          sha256sum package.json bun.lock
          bun install --frozen-lockfile
      - name: Build and pack the pinned public SDK source
        working-directory: aeolia
        run: |
          test "$(git rev-parse HEAD)" = "9bf36bb99937b3e18eec050ad5aa6559ac27f3fb"
          echo "Aeolia tree: $(git rev-parse HEAD^{tree})"
          bun install --frozen-lockfile
          bun run build
          mkdir -p "$RUNNER_TEMP/aeolia-data-preview"
          bun pm pack --filename "$RUNNER_TEMP/aeolia-data-preview/aeolia.tgz"
          sha256sum "$RUNNER_TEMP/aeolia-data-preview/aeolia.tgz"
      - name: Install the runner-only SDK overlay
        env:
          AEOLIA_PREVIEW_ARCHIVE: ${{ runner.temp }}/aeolia-data-preview/aeolia.tgz
        run: |
          bun run - <<'JS'
          import { resolve } from "node:path";
          const sdk = await Bun.file("../aeolia/package.json").json();
          if (sdk.version !== "1.0.0-alpha.1-build101320260219") throw new Error("Unexpected SDK version");
          for (const file of ["package.json", "golden/package.json", "packages/elysia/package.json", "packages/graphql/package.json", "packages/grpc/package.json", "packages/hesperia/package.json"]) {
            const manifest = await Bun.file(file).json();
            let changed = false;
            for (const field of ["dependencies", "devDependencies", "peerDependencies"]) {
              if (manifest[field]?.aeolia !== undefined) {
                manifest[field].aeolia = sdk.version;
                changed = true;
              }
            }
            if (file === "package.json") manifest.overrides.aeolia = "file:" + resolve(process.env.AEOLIA_PREVIEW_ARCHIVE).replaceAll("\\", "/");
            if (!changed) throw new Error("Missing expected Aeolia dependency in " + file);
            await Bun.write(file, JSON.stringify(manifest, null, 2) + String.fromCharCode(10));
          }
          JS
          bun install --ignore-scripts
          echo "Runner-only archive: $AEOLIA_PREVIEW_ARCHIVE"
          echo "Runner-only preview manifests and lock:"
          git status --short
          sha256sum package.json bun.lock "$AEOLIA_PREVIEW_ARCHIVE"
      - name: Verify installed SDK bytes and workspace resolutions
        env:
          AEOLIA_PREVIEW_ARCHIVE: ${{ runner.temp }}/aeolia-data-preview/aeolia.tgz
        run: |
          archive_hash="$(cd "$RUNNER_TEMP/aeolia-data-preview" && tar -xOf ./aeolia.tgz package/dist/index.js | sha256sum | cut -d' ' -f1)"
          installed_hash="$(sha256sum node_modules/aeolia/dist/index.js | cut -d' ' -f1)"
          test "$archive_hash" = "$installed_hash"
          echo "Installed SDK dist/index.js SHA-256: $installed_hash"
          node --input-type=module <<'JS'
          import { createRequire } from "node:module";
          import { readFileSync, realpathSync } from "node:fs";
          import { join, resolve, sep } from "node:path";
          import { pathToFileURL } from "node:url";
          const root = realpathSync("node_modules/aeolia");
          const manifest = JSON.parse(readFileSync(join(root, "package.json"), "utf8"));
          if (manifest.version !== "1.0.0-alpha.1-build101320260219") throw new Error("Wrong SDK version");
          for (const dir of [".", "golden", "packages/elysia", "packages/graphql", "packages/grpc", "packages/hesperia"]) {
            const require = createRequire(resolve(dir, "package.json"));
            const entry = realpathSync(require.resolve("aeolia"));
            if (!entry.startsWith(root + sep)) throw new Error(dir + " resolved a different SDK: " + entry);
            console.log(dir + " -> " + entry);
          }
          const sdk = await import(pathToFileURL(join(root, "dist/index.js")).href);
          for (const name of ["observeStore", "observeQueryProgress", "callQueryWithProgress"]) {
            if (typeof sdk[name] !== "function") throw new Error("Missing SDK export " + name);
          }
          console.log("SDK version and runtime exports verified:", manifest.version);
          JS
      - name: Build Hesperia with the preview SDK
        run: bun run build
      - name: Typecheck Hesperia with the preview SDK
        run: bun run typecheck
      - name: Run the named public projection case
        if: matrix.kind == 'projection'
        timeout-minutes: 2
        env:
          TEST_PATTERN: ${{ matrix.pattern }}
        run: bun test --timeout=45000 --test-name-pattern "$TEST_PATTERN" ./tests/data/contract-adapter.integration.test.ts
      - name: Run the finite GraphQL owner
        if: matrix.kind == 'finite'
        timeout-minutes: 5
        run: bun test --timeout=45000 ./tests/data/graphql.integration.test.ts
