name: CI
on:
  pull_request:
    branches:
      - main
      - "release/*"
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ format('ci-{0}', github.event.pull_request.number || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha) || github.ref) }}
  cancel-in-progress: true
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.sha }}
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}
      full: ${{ github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && startsWith(github.head_ref, 'release/')) }}
      release-pr: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.base_ref == 'main' && startsWith(github.head_ref, 'release/') }}
  required:
    name: Required
    if: "always()"
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: "Require verification"
        env:
          RESULT: ${{ needs.verify.result }}
        run: 'test "$RESULT" = success'
