name: Verify
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        default: ""
      head:
        type: string
        default: ""
      full:
        type: boolean
        default: false
      release-pr:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    name: "Build, types, lint and format"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      compiler: ${{ steps.scope.outputs.compiler }}
      runtime: ${{ steps.scope.outputs.runtime }}
      data: ${{ steps.scope.outputs.data }}
      tooling: ${{ steps.scope.outputs.tooling }}
      routing: ${{ steps.scope.outputs.routing }}
      editor: ${{ steps.scope.outputs.editor }}
      hosting: ${{ steps.scope.outputs.hosting }}
      ci: ${{ steps.scope.outputs.ci }}
      full: ${{ steps.scope.outputs.full }}
      behavior: ${{ steps.scope.outputs.full == 'true' || steps.scope.outputs.compiler == 'true' || steps.scope.outputs.runtime == 'true' || steps.scope.outputs.data == 'true' || steps.scope.outputs.tooling == 'true' || steps.scope.outputs.routing == 'true' || steps.scope.outputs.editor == 'true' || steps.scope.outputs.hosting == 'true' || steps.scope.outputs.ci == 'true' }}
      browser: ${{ steps.scope.outputs.browser }}
      package: ${{ steps.scope.outputs.package }}
      vscode: ${{ steps.scope.outputs.vscode }}
      golden: ${{ steps.scope.outputs.golden }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: "Record the checked out revision"
        id: revision
        shell: bash
        run: 'printf "sha=%s\n" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"'
      - uses: ./.github/actions/setup
      - name: "Check repository branch name"
        if: "github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          HESPERIA_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bun -e '
            import assert from "node:assert/strict";
            import { releaseVersion } from "./scripts/ci/check-release.ts";
            const branch = process.env.HESPERIA_HEAD_BRANCH;
            assert.ok(/^(feature|fix)\/.+$/.test(branch) || branch.startsWith("release/"),
              "Use feature/<name>, fix/<name>, or release/<VERSION> for repository branches");
            if (branch.startsWith("release/")) {
              const { version } = releaseVersion(branch.slice("release/".length));
              assert.equal(version, (await Bun.file("package.json").json()).version,
                "The release branch version must match package.json");
            }
          '
      - name: "Select verification owners and consumers"
        id: paths
        continue-on-error: true
        shell: bash
        env:
          VERIFICATION_BASE: ${{ inputs.base }}
          VERIFICATION_HEAD: ${{ inputs.ref }}
          VERIFICATION_FULL: ${{ inputs.full }}
        run: |
          args=(--base "$VERIFICATION_BASE" --head "$VERIFICATION_HEAD")
          if [ "$VERIFICATION_FULL" = true ]; then args+=(--full); fi
          bun scripts/ci/select-verification.ts "${args[@]}"
      - name: "Resolve verification scope"
        id: scope
        shell: bash
        env:
          FULL: ${{ inputs.full || steps.paths.outcome != 'success' || steps.paths.outputs.all_count == '' || steps.paths.outputs.all_count == '0' || steps.paths.outputs.full != 'false' || steps.paths.outputs.policy == 'true' || steps.paths.outputs.scope_complete != 'true' }}
          COMPILER: ${{ steps.paths.outputs.compiler == 'true' }}
          RUNTIME: ${{ steps.paths.outputs.runtime == 'true' }}
          DATA: ${{ steps.paths.outputs.data == 'true' }}
          TOOLING: ${{ steps.paths.outputs.tooling == 'true' }}
          ROUTING: ${{ steps.paths.outputs.routing == 'true' }}
          EDITOR: ${{ steps.paths.outputs.editor == 'true' }}
          HOSTING: ${{ steps.paths.outputs.hosting == 'true' }}
          CI: ${{ steps.paths.outputs.ci == 'true' }}
          BROWSER: ${{ steps.paths.outputs.browser == 'true' }}
          PACKAGE: ${{ steps.paths.outputs.package == 'true' }}
          VSCODE: ${{ steps.paths.outputs.vscode == 'true' }}
          GOLDEN: ${{ steps.paths.outputs.golden == 'true' }}
        run: |
          for scope in FULL COMPILER RUNTIME DATA TOOLING ROUTING EDITOR HOSTING CI BROWSER PACKAGE VSCODE GOLDEN; do
            value="${!scope}"
            if [ "$FULL" = true ]; then value=true; fi
            printf '%s=%s\n' "${scope,,}" "$value" >> "$GITHUB_OUTPUT"
          done
      - name: "Build workspace packages"
        run: "bun run build"
      - name: "Check types"
        run: "bun run typecheck"
      - name: Lint
        run: "bun run lint"
      - name: "Check formatting"
        run: "bun run fmt:check"
      - name: "Check release version"
        if: inputs.release-pr
        run: "bun scripts/ci/check-release.ts"
        env:
          HESPERIA_RELEASE_BASE: ${{ inputs.base }}
          HESPERIA_RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
      - name: "Prepare the package candidate"
        if: "steps.scope.outputs.package == 'true' || steps.scope.outputs.vscode == 'true'"
        run: "bun scripts/ci/prepare-release-candidate.ts --candidate-dir .hesperia/release-candidate"
      - name: "Save the package candidate"
        if: "steps.scope.outputs.package == 'true' || steps.scope.outputs.vscode == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-candidate
          path: .hesperia/release-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - name: "Prepare the editor candidate"
        if: "steps.scope.outputs.vscode == 'true'"
        run: "bun scripts/ci/editor-package.ts"
      - name: "Save the editor candidate"
        if: "steps.scope.outputs.vscode == 'true'"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editor-candidate
          path: .hesperia/editor-candidate/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
  source-quality:
    name: "Selected behavior (${{ matrix.platform }})"
    needs: checks
    if: "needs.checks.outputs.behavior == 'true' && needs.checks.outputs.full == 'false'"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Build workspace packages"
        run: "bun run build"
      - name: "Install browser engines and system dependencies"
        if: "runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium firefox webkit"
      - name: "Install browser engines"
        if: "runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium firefox webkit"
      - name: "Test compiler"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.compiler == 'true'"
        run: "bun test --timeout=45000 tests/compiler"
      - name: "Test runtime"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.runtime == 'true'"
        run: "bun test --timeout=45000 tests/runtime"
      - name: "Test data"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.data == 'true'"
        run: "bun test --timeout=45000 tests/data"
      - name: "Test tooling"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.tooling == 'true'"
        run: "bun test --timeout=45000 tests/tooling"
      - name: "Test routing"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.routing == 'true'"
        run: "bun test --timeout=45000 tests/routing"
      - name: "Test editor"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.editor == 'true'"
        run: "bun test --timeout=45000 tests/editor"
      - name: "Test hosting"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.hosting == 'true'"
        run: "bun test --timeout=45000 tests/hosting"
      - name: "Test ci"
        if: "needs.checks.outputs.full == 'false' && needs.checks.outputs.ci == 'true'"
        run: "bun test --timeout=45000 tests/ci"
      - name: "Retain browser failure diagnostics"
        if: "failure()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-browser-diagnostics-${{ matrix.platform }}-${{ github.run_attempt }}"
          if-no-files-found: ignore
          include-hidden-files: true
          path: .hesperia/browser-diagnostics/
          retention-days: 14
  coverage-groups:
    name: "Coverage (${{ matrix.platform }}, ${{ matrix.group }})"
    needs: checks
    if: "needs.checks.outputs.full == 'true'"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-2025
        group:
          - bun-tests-ordinary
          - project-worker-owner
          - browser-css
          - native-editor
    env:
      HESPERIA_CI_COVERAGE_REVISION: ${{ needs.checks.outputs.revision }}
      DONT_PROMPT_WSL_INSTALL: 1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.checks.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Build workspace packages"
        run: "bun run build"
      - name: "Install ordinary test browser engines and system dependencies"
        if: "matrix.group == 'bun-tests-ordinary' && runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium firefox webkit"
      - name: "Install ordinary test browser engines"
        if: "matrix.group == 'bun-tests-ordinary' && runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium firefox webkit"
      - name: "Install CSS capture Chromium and system dependencies"
        if: "matrix.group == 'browser-css' && runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium"
      - name: "Install CSS capture Chromium"
        if: "matrix.group == 'browser-css' && runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium"
      - name: "Set up the real editor"
        id: editor
        if: "matrix.group == 'native-editor'"
        uses: ./.github/actions/setup-editor
      - name: "Run Linux editor observer stdlib tests"
        if: "matrix.group == 'native-editor' && runner.os == 'Linux'"
        shell: bash
        run: "python3 -B editors/vscode/tests/test_linux_observer.py -v"
      - name: "Run the original coverage group"
        env:
          COVERAGE_GROUP: ${{ matrix.group }}
          CODE_PATH: ${{ steps.editor.outputs.code-path }}
          CODE_VERSION: ${{ steps.editor.outputs.code-version }}
        shell: bash
        run: |
          args=(--group "$COVERAGE_GROUP")
          if [ "$COVERAGE_GROUP" = native-editor ]; then
            args+=("$CODE_PATH" "$CODE_VERSION")
          fi
          bun run scripts/ci/coverage-owner-launcher.ts scripts/ci/run-final-coverage.ts -- "${args[@]}"
      - name: "Retain the original group evidence"
        if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-coverage-group-${{ matrix.platform }}-${{ matrix.group }}-${{ github.run_attempt }}"
          if-no-files-found: warn
          include-hidden-files: true
          path: .hesperia/coverage/group-artifact/
          retention-days: 14
      - name: "Retain native controls and package capture receipts"
        if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-coverage-diagnostics-${{ matrix.platform }}-${{ matrix.group }}-${{ github.run_attempt }}"
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .hesperia/coverage/editor-controls/
            .hesperia/coverage/worker-builds/*/captures/
          retention-days: 14
      - name: "Retain original evidence after failed group admission"
        if: "failure()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-coverage-failed-group-${{ matrix.platform }}-${{ matrix.group }}-${{ github.run_attempt }}"
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .hesperia/coverage/final-runs/
            .hesperia/coverage/runs/
            .hesperia/coverage/browser-css-runs/
            .hesperia/ec/
            .hesperia/browser-diagnostics/
          retention-days: 14
  coverage-platform:
    name: "Coverage aggregate (${{ matrix.platform }})"
    needs:
      - checks
      - coverage-groups
    if: "always() && needs.checks.result == 'success' && needs.checks.outputs.full == 'true'"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-2025
    env:
      HESPERIA_CI_COVERAGE_REVISION: ${{ needs.checks.outputs.revision }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.checks.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Download this platform's original groups"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: "hesperia-coverage-group-${{ matrix.platform }}-*-${{ github.run_attempt }}"
          path: .coverage-groups
      - name: "Admit all four groups and capture aggregate support"
        run: "bun run scripts/ci/coverage-owner-launcher.ts scripts/ci/run-final-coverage.ts -- --aggregate .coverage-groups"
      - name: "Retain final and original coverage evidence"
        if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-coverage-${{ matrix.platform }}-${{ github.run_attempt }}"
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .hesperia/coverage/final-runs/
            .hesperia/coverage/runs/
            .hesperia/coverage/browser-css-runs/
            .hesperia/ec/
          retention-days: 14
  combined-coverage:
    name: "Combined Windows and Linux coverage"
    needs:
      - checks
      - coverage-platform
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.checks.outputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Download Windows coverage evidence"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: "hesperia-coverage-windows-2025-${{ github.run_attempt }}"
          path: .coverage-artifacts/windows
      - name: "Download Linux coverage evidence"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: "hesperia-coverage-ubuntu-24.04-${{ github.run_attempt }}"
          path: .coverage-artifacts/linux
      - name: "Check combined Windows and Linux coverage"
        run: "bun run scripts/ci/run-combined-coverage.ts --windows-root .coverage-artifacts/windows --linux-root .coverage-artifacts/linux --output .hesperia/coverage/combined"
      - name: "Retain combined coverage report"
        if: "always()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "hesperia-coverage-combined-${{ github.run_attempt }}"
          if-no-files-found: warn
          include-hidden-files: true
          path: .hesperia/coverage/combined/
    if: "needs.checks.outputs.full == 'true'"
  browser:
    name: "Browser suite (${{ matrix.platform }})"
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Build Hesperia packages"
        run: "bun run build"
      - name: "Install all browser engines"
        if: "runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium firefox webkit"
      - name: "Install all browser engines"
        if: "runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium firefox webkit"
      - name: "Run browser suite in Chromium, Firefox, and WebKit"
        run: "bun run test:browser"
      - name: "Retain failed browser traces"
        if: "failure()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "browser-traces-${{ matrix.platform }}"
          path: test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
    needs: checks
    if: "needs.checks.outputs.browser == 'true'"
  package:
    name: "Installed package candidate (${{ matrix.platform }})"
    needs: checks
    if: "needs.checks.outputs.package == 'true'"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Build workspace packages"
        run: "bun run build"
      - name: "Install browser engines and system dependencies"
        if: "runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium firefox webkit"
      - name: "Install browser engines"
        if: "runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium firefox webkit"
      - name: "Download the tested package candidate"
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-candidate
          path: .hesperia/release-candidate
      - name: "Validate the package candidate"
        run: "bun scripts/ci/verify-release-candidate.ts --candidate-dir .hesperia/release-candidate"
      - name: "Run installed and linked package behavior"
        run: "bun test --timeout=60000 tests/package"
        env:
          HESPERIA_RELEASE_CANDIDATE_DIR: ${{ format('{0}/.hesperia/release-candidate', github.workspace) }}
  golden-plan:
    name: "Select implemented golden suites"
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
      catalog_valid: ${{ steps.plan.outputs.catalog_valid }}
      selection_summary: ${{ steps.plan.outputs.selection_summary }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Plan the selected suites and matrix"
        id: plan
        env:
          GOLDEN_BASE_SHA: ${{ inputs.base || inputs.ref }}
          GOLDEN_HEAD_SHA: ${{ inputs.ref }}
          GOLDEN_FULL_SUITE: ${{ needs.checks.outputs.full }}
        run: |
          args=(
            --base "$GOLDEN_BASE_SHA"
            --head "$GOLDEN_HEAD_SHA"
            --catalog-path golden/catalog.json
            --graph-path golden/dependency-graph.json
          )
          if [ "$GOLDEN_FULL_SUITE" = "true" ]; then
            args+=(--release-candidate)
          fi
          bun run scripts/ci/plan-golden.ts "${args[@]}"
        shell: bash
    needs: checks
    if: "needs.checks.outputs.golden == 'true'"
  golden:
    name: "Golden suites (${{ matrix.platform }}, ${{ matrix.project }})"
    needs:
      - checks
      - golden-plan
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.golden-plan.outputs.matrix) }}
    env:
      GOLDEN_PROJECT: ${{ matrix.project }}
      GOLDEN_SUITES_JSON: ${{ toJSON(matrix.suites) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Build packages"
        run: "bun run build"
      - name: "Install all browser engines"
        if: "runner.os == 'Linux'"
        run: "node node_modules/playwright/cli.js install --with-deps chromium firefox webkit"
      - name: "Install all browser engines"
        if: "runner.os == 'Windows'"
        run: "node node_modules/playwright/cli.js install chromium firefox webkit"
      - name: "Run every selected suite in the matrix browser"
        run: |
          mapfile -t suites < <(node -e 'for (const suite of JSON.parse(process.env.GOLDEN_SUITES_JSON)) console.log(suite)')
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "The golden plan returned no runnable suites" >&2
            exit 1
          fi

          if [ "$RUNNER_OS" = "Windows" ] && [ "$GOLDEN_PROJECT" = "firefox" ]; then
            export DEBUG=pw:protocol,pw:browser
            export DEBUG_COLORS=0
            export MAX_LOG_LENGTH=8192
            exec 2>golden-firefox-stderr.log
          fi

          node ../node_modules/@playwright/test/cli.js test --project="$GOLDEN_PROJECT" "${suites[@]}"
        shell: bash
        working-directory: golden
      - name: "Retain failed golden traces"
        if: "failure()"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "golden-traces-${{ matrix.platform }}-${{ matrix.project }}-${{ strategy.job-index }}"
          path: |
            golden/test-results/**/trace.zip
            golden/golden-firefox-stderr.log
          if-no-files-found: ignore
          retention-days: 7
      - name: "Reject a catalog that names unimplemented suites"
        if: "needs.golden-plan.outputs.catalog_valid != 'true'"
        run: |
          echo "The complete discovered golden suite ran, but the catalog needs repair." >&2
          exit 1
        shell: bash
    if: "needs.checks.outputs.golden == 'true' && needs.golden-plan.result == 'success'"
  vscode:
    name: "Installed Windows VS Code extension"
    needs: checks
    if: "needs.checks.outputs.vscode == 'true'"
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: "Set up the real editor"
        id: editor
        uses: ./.github/actions/setup-editor
      - name: "Build workspace packages"
        run: "bun run build"
      - name: "Check editor types"
        run: "bun run --cwd editors/vscode typecheck"
      - name: "Build the editor extension"
        run: "bun run --cwd editors/vscode build"
      - name: "Build the editor test host"
        run: "bun run --cwd editors/vscode build:test"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-candidate
          path: .hesperia/release-candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: editor-candidate
          path: .hesperia/editor-candidate
      - name: "Test the installed VSIX against installed package archives"
        env:
          VSCODE_CODE_PATH: ${{ steps.editor.outputs.code-path }}
        run: "bun scripts/ci/test-editor-package.ts"
      - name: "Save installed extension acceptance"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: editor-package-evidence
          path: .hesperia/editor-package-evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
  result:
    name: "Verification result"
    if: "always()"
    needs:
      - checks
      - source-quality
      - coverage-groups
      - coverage-platform
      - combined-coverage
      - browser
      - package
      - golden-plan
      - golden
      - vscode
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: "Set up Bun"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: "Require every selected verification job"
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          bun -e '
            import assert from "node:assert/strict";
            const jobs = JSON.parse(process.env.RESULTS);
            const scope = jobs.checks.outputs;
            const selected = { "source-quality": "behavior", browser: "browser", package: "package", vscode: "vscode", "golden-plan": "golden", golden: "golden" };
            for (const [name, job] of Object.entries(jobs)) {
              const excluded = (name === "source-quality" && scope.full === "true") ||
                (scope.full === "false" &&
                  (["coverage-groups", "coverage-platform", "combined-coverage"].includes(name) || scope[selected[name]] === "false"));
              assert.ok(job.result === "success" || (excluded && job.result === "skipped"),
                name + " must succeed when selected; received " + job.result);
            }
          '
