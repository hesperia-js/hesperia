name: "Set up Hesperia tools"
description: "Install pinned runtimes and frozen workspace dependencies."
inputs:
  install:
    description: "Install workspace dependencies."
    default: "true"
  prefer-ubuntu-archive:
    description: "Prefer the Ubuntu archive over the Azure Ubuntu mirror."
    default: "false"
runs:
  using: composite
  steps:
    - name: "Prefer the Ubuntu archive"
      if: "runner.os == 'Linux' && inputs.prefer-ubuntu-archive == 'true'"
      shell: bash
      env:
        APT_MIRRORS_FILE: /etc/apt/apt-mirrors.txt
      run: |
        if [[ -f "$APT_MIRRORS_FILE" && ! -L "$APT_MIRRORS_FILE" ]] &&
          grep -Eq '^https://archive\.ubuntu\.com/ubuntu/[[:blank:]]+priority:[0-9]+$' "$APT_MIRRORS_FILE" &&
          grep -Eq '^https?://azure\.archive\.ubuntu\.com/ubuntu/[[:blank:]]+priority:[0-9]+$' "$APT_MIRRORS_FILE"; then
          sudo sed -i -E '\|^https?://azure\.archive\.ubuntu\.com/ubuntu/[[:blank:]]+priority:[0-9]+$|d' "$APT_MIRRORS_FILE"
        fi

        if [[ -f "$APT_MIRRORS_FILE" ]]; then
          echo "APT mirror list:"
          cat "$APT_MIRRORS_FILE"
        else
          echo "APT mirror list is unavailable."
        fi
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22.23.2
        package-manager-cache: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: 1.4.4
    - if: "inputs.install == 'true'"
      shell: bash
      run: "bun install --frozen-lockfile"
