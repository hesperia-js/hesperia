name: "Set up the real editor"
description: "Verify current stable VS Code above the extension baseline and install native observer tools."
outputs:
  code-path:
    description: "Verified native VS Code executable or launcher."
    value: ${{ steps.windows.outputs.code-path || steps.linux.outputs.code-path }}
  code-version:
    description: "Actual stable VS Code version selected from Microsoft's update metadata."
    value: ${{ steps.metadata.outputs.version }}
runs:
  using: composite
  steps:
    - name: "Resolve current stable VS Code above the extension baseline"
      id: metadata
      shell: bash
      run: |
        bun -e '
          import assert from "node:assert/strict";
          import { appendFileSync } from "node:fs";
          const manifest = await Bun.file("editors/vscode/package.json").json();
          const platform = process.platform === "win32" ? "win32-x64-archive" : "linux-deb-x64";
          const response = await fetch("https://update.code.visualstudio.com/api/update/" + platform + "/stable/latest", { signal: AbortSignal.timeout(30000) });
          assert.ok(response.ok, "VS Code stable metadata request failed: " + response.status);
          const metadata = await response.json();
          assert.match(metadata.productVersion, /^\d+\.\d+\.\d+$/);
          assert.ok(Bun.semver.satisfies(metadata.productVersion, manifest.engines.vscode), "Stable VS Code does not satisfy the extension engine requirement");
          assert.ok(Bun.semver.order(metadata.productVersion, manifest.devDependencies["@types/vscode"]) >= 0, "Stable VS Code is below the extension API type baseline");
          assert.match(metadata.version, /^[a-f0-9]{40}$/);
          assert.match(metadata.sha256hash, /^[a-f0-9]{64}$/);
          const url = new URL(metadata.url);
          assert.equal(url.protocol, "https:");
          assert.equal(url.hostname, "vscode.download.prss.microsoft.com");
          const outputs = { version: metadata.productVersion, commit: metadata.version, sha256: metadata.sha256hash, url: url.href };
          appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(outputs).map(([key, value]) => key + "=" + value + "\n").join(""));
          console.log({ engineRequirement: manifest.engines.vscode, apiBaseline: manifest.devDependencies["@types/vscode"], ...outputs });
        '
    - name: "Install and verify the Windows VS Code archive"
      if: "runner.os == 'Windows'"
      shell: pwsh
      env:
        CODE_VERSION: ${{ steps.metadata.outputs.version }}
        CODE_COMMIT: ${{ steps.metadata.outputs.commit }}
        CODE_SHA256: ${{ steps.metadata.outputs.sha256 }}
        CODE_URL: ${{ steps.metadata.outputs.url }}
      run: |
        $version = $env:CODE_VERSION
        $expectedSha256 = $env:CODE_SHA256
        $archive = Join-Path $env:RUNNER_TEMP "vscode-$version.zip"
        $destination = Join-Path $env:RUNNER_TEMP "vscode-$version"
        Invoke-WebRequest -Uri $env:CODE_URL -OutFile $archive
        $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSha256 -ne $expectedSha256) { throw "VS Code $version archive SHA-256 mismatch: expected $expectedSha256, received $actualSha256." }
        Expand-Archive -LiteralPath $archive -DestinationPath $destination
        $code = Get-ChildItem -LiteralPath $destination -Filter Code.exe -File -Recurse | Select-Object -First 1
        if ($null -eq $code) { throw "VS Code $version archive did not contain Code.exe." }
        $packages = @(Get-ChildItem -LiteralPath $destination -Filter package.json -File -Recurse | Where-Object { $_.DirectoryName -match '[\\/]resources[\\/]app$' })
        if ($packages.Count -ne 1) { throw "Expected one VS Code resources/app/package.json manifest, found $($packages.Count)." }
        $packageVersion = (Get-Content -LiteralPath $packages[0].FullName -Raw | ConvertFrom-Json).version
        if ($packageVersion -ne $version) { throw "Expected VS Code archive package $version, received $packageVersion." }
        $product = Get-Content -LiteralPath (Join-Path $packages[0].DirectoryName 'product.json') -Raw | ConvertFrom-Json
        if ($product.commit -ne $env:CODE_COMMIT) { throw 'VS Code archive product commit differs from official metadata.' }
        $actual = $code.VersionInfo.ProductVersion
        if ($actual -ne $version) { throw "Expected VS Code executable ProductVersion $version, received $actual." }
        "code-path=$($code.FullName)" >> $env:GITHUB_OUTPUT
      id: windows
    - name: "Install and verify Linux VS Code and native observer tools"
      if: "runner.os == 'Linux'"
      shell: bash
      env:
        CODE_VERSION: ${{ steps.metadata.outputs.version }}
        CODE_COMMIT: ${{ steps.metadata.outputs.commit }}
        CODE_SHA256: ${{ steps.metadata.outputs.sha256 }}
        CODE_URL: ${{ steps.metadata.outputs.url }}
      run: |
        sudo apt-get update
        sudo apt-get install --yes python3 xvfb strace
        code_deb="$RUNNER_TEMP/code_${CODE_VERSION}_amd64.deb"
        curl --fail --silent --show-error --location \
          --output "$code_deb" \
          "$CODE_URL"
        printf '%s  %s\n' "$CODE_SHA256" "$code_deb" | sha256sum --check
        sudo apt-get install --yes "$code_deb"
        code_path="$(readlink -f -- "$(command -v code)")"
        [[ -n "$code_path" ]]
        owner_record="$(dpkg-query -S "$code_path")"
        [[ "$owner_record" == code:* ]]
        package_version="$(dpkg-query -W -f='${Version}' code)"
        case "$package_version" in
          "$CODE_VERSION"|"$CODE_VERSION"-*) ;;
          *) printf 'Unexpected VS Code package version: %s\n' "$package_version" >&2; exit 1 ;;
        esac
        printf 'code_path=%s\n%s\ncode_package_version=%s\n' "$code_path" "$owner_record" "$package_version"
        dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' code python3 xvfb strace
        mkdir -p "$RUNNER_TEMP/vscode-linux-user-data"
        code_output="$(DONT_PROMPT_WSL_INSTALL=1 code --no-sandbox --user-data-dir="$RUNNER_TEMP/vscode-linux-user-data" --version)"
        printf '%s\n' "$code_output"
        mapfile -t code_lines <<< "$code_output"
        [[ "${code_lines[0]:-}" == "$CODE_VERSION" ]]
        [[ "${code_lines[1]:-}" == "$CODE_COMMIT" ]]
        [[ "${code_lines[2]:-}" == 'x64' ]]
        command -v Xvfb
        python3 --version
        strace --version
        printf 'code-path=%s\n' "$code_path" >> "$GITHUB_OUTPUT"
      id: linux
